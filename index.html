<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Шахматы Дуэль</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --bg-color: #262421;
      --card-bg: #1e1e24;
      --light-square: #d9e0e6;
      --dark-square: #557ca4;
      --highlight-color: #a4c57f;
      --text-color: #ffffff;
      --text-secondary: #98989f;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: fixed;
      width: 100vw;
    }

    .header {
      text-align: center;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    h2 {
      margin: 0 0 4px 0;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-color);
    }

    #status {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .board-container {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      flex-shrink: 0;
    }

    .chessboard {
      display: grid;
      grid-template-columns: repeat(8, 38px);
      grid-template-rows: repeat(8, 38px);
      width: 304px;
      height: 304px;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      position: relative;
      cursor: pointer;
    }

    .square.light { background-color: var(--light-square); }
    .square.dark  { background-color: var(--dark-square); }

    /* Подсветка выбранной клетки и хода */
    .square.highlight::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--highlight-color);
      mix-blend-mode: multiply;
      opacity: 0.85;
      pointer-events: none;
    }

    .piece {
      width: 30px;
      height: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    }
    
    .piece svg {
      width: 100%;
      height: 100%;
    }

    .controls {
      margin-top: 16px;
      flex-shrink: 0;
    }

    .btn {
      background-color: #3b3b4f;
      color: var(--text-color);
      border: none;
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div class="header">
    <h2>Шахматы Дуэль</h2>
    <div id="status">Ход: Белые</div>
  </div>

  <div class="board-container">
    <div class="chessboard" id="board"></div>
  </div>

  <div class="controls">
    <button class="btn" onclick="resetGame()">Новая игра</button>
  </div>

  <script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let game = new Chess();
    let selectedSquare = null;
    let lastMove = null;

    // Встроенные SVG-шаблоны фигур
    const svgPieces = {
      'wP': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M 33.5 85 L 66.5 85 L 66.5 76.5 L 61.5 76.5 L 58.5 60.5 C 64.5 57.5 69 51.5 69 44.5 C 69 35 61.5 27.5 52 27.5 C 42.5 27.5 35 35 35 44.5 C 35 51.5 39.5 57.5 45.5 60.5 L 42.5 76.5 L 37.5 76.5 L 37.5 85 Z" fill="#fff" stroke="#000" stroke-width="5" stroke-linejoin="round"/></svg>',
      'wN': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M 30 85 L 70 85 L 70 76.5 L 60 76.5 L 60 66 C 60 55 68 50 68 38 L 58 38 L 54 43 C 48 30 38 25 30 25 L 25 40 L 35 45 L 30 55 L 40 60 L 40 76.5 L 30 76.5 Z" fill="#fff" stroke="#000" stroke-width="5" stroke-linejoin="round"/></svg>',
      'wB': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M 33 85 L 67 85 L 67 76 L 59 76 L 61 60 C 70 55 70 45 58 32 L 54 26 L 50 30 L 46 26 L 42 32 C 30 45 30 55 39 60 L 41 76 L 33 76 Z" fill="#fff" stroke="#000" stroke-width="5" stroke-linejoin="round"/></svg>',
      'wR': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M 27 85 L 73 85 L 73 76 L 65 76 L 65 35 L 73 35 L 73 15 L 60 15 L 60 25 L 52 25 L 52 15 L 48 15 L 48 25 L 40 25 L 40 15 L 27 15 L 27 35 L 35 35 L 35 76 L 27 76 Z" fill="#fff" stroke="#000" stroke-width="5" stroke-linejoin="round"/></svg>',
      'wQ': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M 22 85 L 78 85 L 78 76 L 70 76 L 72 45 L 60 55 L 52 30 L 48 30 L 40 55 L 28 45 L 30 76 L 22 76 Z" fill="#fff" stroke="#000" stroke-width="5" stroke-linejoin="round"/><circle cx="22" cy="35" r="6" fill="#fff" stroke="#000" stroke-width="4"/><circle cx="78" cy="35" r="6" fill="#fff" stroke="#000" stroke-width="4"/><circle cx="32" cy="30" r="6" fill="#fff" stroke="#000" stroke-width="4"/><circle cx="68" cy="30" r="6" fill="#fff" stroke="#000" stroke-width="4"/><circle cx="50" cy="20" r="6" fill="#fff" stroke="#000" stroke-width="4"/></svg>',
      'wK': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M 50 15 L 50 35 M 40 25 L 60 25 M 33 85 L 67 85 L 67 76 L 59 76 L 61 55 L 50 40 L 39 55 L 41 76 L 33 76 Z" fill="#fff" stroke="#000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></svg>',

      'bP': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M 33.5 85 L 66.5 85 L 66.5 76.5 L 61.5 76.5 L 58.5 60.5 C 64.5 57.5 69 51.5 69 44.5 C 69 35 61.5 27.5 52 27.5 C 42.5 27.5 35 35 35 44.5 C 35 51.5 39.5 57.5 45.5 60.5 L 42.5 76.5 L 37.5 76.5 L 37.5 85 Z" fill="#000" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>',
      'bN': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M 30 85 L 70 85 L 70 76.5 L 60 76.5 L 60 66 C 60 55 68 50 68 38 L 58 38 L 54 43 C 48 30 38 25 30 25 L 25 40 L 35 45 L 30 55 L 40 60 L 40 76.5 L 30 76.5 Z" fill="#000" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>',
      'bB': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M 33 85 L 67 85 L 67 76 L 59 76 L 61 60 C 70 55 70 45 58 32 L 54 26 L 50 30 L 46 26 L 42 32 C 30 45 30 55 39 60 L 41 76 L 33 76 Z" fill="#000" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>',
      'bR': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M 27 85 L 73 85 L 73 76 L 65 76 L 65 35 L 73 35 L 73 15 L 60 15 L 60 25 L 52 25 L 52 15 L 48 15 L 48 25 L 40 25 L 40 15 L 27 15 L 27 35 L 35 35 L 35 76 L 27 76 Z" fill="#000" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>',
      'bQ': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M 22 85 L 78 85 L 78 76 L 70 76 L 72 45 L 60 55 L 52 30 L 48 30 L 40 55 L 28 45 L 30 76 L 22 76 Z" fill="#000" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><circle cx="22" cy="35" r="6" fill="#000" stroke="#fff" stroke-width="4"/><circle cx="78" cy="35" r="6" fill="#000" stroke="#fff" stroke-width="4"/><circle cx="32" cy="30" r="6" fill="#000" stroke="#fff" stroke-width="4"/><circle cx="68" cy="30" r="6" fill="#000" stroke="#fff" stroke-width="4"/><circle cx="50" cy="20" r="6" fill="#000" stroke="#fff" stroke-width="4"/></svg>',
      'bK': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M 50 15 L 50 35 M 40 25 L 60 25 M 33 85 L 67 85 L 67 76 L 59 76 L 61 55 L 50 40 L 39 55 L 41 76 L 33 76 Z" fill="#000" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></svg>'
    };

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      const board = game.board();

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const squareEl = document.createElement('div');
          const isLight = (r + c) % 2 === 0;
          squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
          
          const file = 'abcdefgh'[c];
          const rank = 8 - r;
          const squareCoord = file + rank;

          // Подсветка
          if (lastMove && (lastMove.from === squareCoord || lastMove.to === squareCoord)) {
            squareEl.classList.add('highlight');
          }
          if (selectedSquare === squareCoord) {
            squareEl.classList.add('highlight');
          }

          const piece = board[r][c];
          if (piece) {
            const pieceKey = piece.color + piece.type.toUpperCase();
            if (svgPieces[pieceKey]) {
              const pieceDiv = document.createElement('div');
              pieceDiv.className = 'piece';
              pieceDiv.innerHTML = svgPieces[pieceKey];
              squareEl.appendChild(pieceDiv);
            }
          }

          squareEl.onclick = () => onSquareClick(squareCoord);
          boardEl.appendChild(squareEl);
        }
      }
      updateStatus();
    }

    function onSquareClick(square) {
      if (selectedSquare === null) {
        const piece = game.get(square);
        if (piece && piece.color === game.turn()) {
          selectedSquare = square;
          renderBoard();
        }
      } else {
        const move = game.move({
          from: selectedSquare,
          to: square,
          promotion: 'q'
        });

        if (move !== null) {
          lastMove = move;
          selectedSquare = null;
        } else {
          const piece = game.get(square);
          if (piece && piece.color === game.turn()) {
            selectedSquare = square;
          } else {
            selectedSquare = null;
          }
        }
        renderBoard();
      }
    }

    function updateStatus() {
      let status = '';
      let moveColor = game.turn() === 'w' ? 'Белые' : 'Черные';

      if (game.in_checkmate()) {
        status = `Мат! Победили ${game.turn() === 'w' ? 'Черные' : 'Белые'} 🎉`;
      } else if (game.in_draw()) {
        status = 'Ничья!';
      } else {
        status = `Ход: ${moveColor}`;
        if (game.in_check()) status += ' (Шах!)';
      }
      document.getElementById('status').textContent = status;
    }

    function resetGame() {
      game.reset();
      selectedSquare = null;
      lastMove = null;
      renderBoard();
    }

    renderBoard();
  </script>
</body>
</html>
