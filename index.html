<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы — Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div class="top-panel">
        <div class="status-bar">
            <span id="status">Ход: Белые</span>
            <div class="material-container">
                <span id="material-diff"></span>
                <span class="captured-icons" id="captured-icons"></span>
            </div>
        </div>
        <div class="moves-ticker" id="moves-ticker"></div>
    </div>

    <div class="board-container" id="board-container">
        <div class="chessboard" id="board"></div>
        <div id="promotion-modal">
            <div class="promo-box" id="promo-options"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="GameController.reset()">Новая игра</button>
    </div>

    <!-- Скрипты -->
    <!-- 1. Подключаем chess.js. Если он не загрузится, выведем ошибку в статус-бар -->
    <script 
        src="https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.6/dist/chess.min.js"
        onerror="console.error('Не удалось загрузить chess.js'); document.getElementById('status').textContent = 'Ошибка сети: движок не загружен';">
    </script>
    
    <!-- 2. Остальные скрипты -->
    <script src="engine.js"></script>
    <script src="renderer.js"></script>
    <script src="animations.js"></script>
    <script src="game.js"></script>
</body>
</html>
