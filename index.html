<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы Дуэль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --light-square: #d9e0e6; 
            --dark-square: #558bb2;
            --text-color: #ffffff;
            --text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
            --highlight-color: rgba(164, 197, 127, 0.85);
            --bg-color: #1e1e1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100vw;
            height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        h2 {
            margin: 0 0 2px 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            text-shadow: var(--text-shadow);
        }

        #status {
            font-size: 13px;
            color: #b0b0b0;
        }

        .board-container {
            position: relative;
            width: 100vw;
            max-width: 100vw;
            aspect-ratio: 1 / 1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.05) 100%);
            flex-shrink: 0;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            position: relative;
        }

        .square {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .square.light {
            background-color: var(--light-square);
        }

        .square.dark {
            background-color: var(--dark-square);
        }

        .square.highlight::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--highlight-color);
            mix-blend-mode: multiply;
            pointer-events: none;
            z-index: 3;
        }

        .piece {
            width: 95%;
            height: 95%;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0px 3px 3px rgba(0, 0, 0, 0.4));
            pointer-events: none;
        }

        .square-coord {
            position: absolute;
            bottom: 2px;
            right: 3px;
            font-size: 10px;
            font-weight: bold;
            color: #000000;
            opacity: 0.35;
            pointer-events: none;
            z-index: 4;
        }

        .controls {
            margin-top: 14px;
            flex-shrink: 0;
        }

        .btn {
            background-color: #3b3b4f;
            color: var(--text-color);
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.96); }
    </style>
</head>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let game = new Chess();
        let selectedSquare = null;
        let lastMove = null;

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            const board = game.board();

            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const isLight = (row + col) % 2 === 0;
                    const squareClass = isLight ? 'light' : 'dark';
                    
                    const file = files[col];
                    const rank = ranks[row];
                    const squareCoord = file + rank;

                    const squareEl = document.createElement('div');
                    squareEl.className = `square ${squareClass}`;

                    if (lastMove && (lastMove.from === squareCoord || lastMove.to === squareCoord)) {
                        squareEl.classList.add('highlight');
                    }
                    if (selectedSquare === squareCoord) {
                        squareEl.classList.add('highlight');
                    }

                    const piece = board[row][col];
                    if (piece) {
                        const pieceCode = piece.color + piece.type.toUpperCase();
                        squareEl.innerHTML = `<svg class="piece" viewBox="0 0 45 45"><use href="#${pieceCode}" /></svg>`;
                    }

                    let coordText = '';
                    if (row === 7) coordText += file;
                    if (col === 7) coordText += rank;

                    if (coordText) {
                        const coordEl = document.createElement('span');
                        coordEl.className = 'square-coord';
                        coordEl.textContent = coordText;
                        squareEl.appendChild(coordEl);
                    }

                    squareEl.onclick = () => onSquareClick(squareCoord);
                    boardElement.appendChild(squareEl);
                }
            }
            updateStatus();
        }

        function onSquareClick(square) {
            if (selectedSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    renderBoard();
                }
            } else {
                const move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move !== null) {
                    lastMove = move;
                    selectedSquare = null;
                } else {
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                    } else {
                        selectedSquare = null;
                    }
                }
                renderBoard();
            }
        }

        function updateStatus() {
            let status = '';
            let moveColor = game.turn() === 'w' ? 'Белые' : 'Черные';

            if (game.in_checkmate()) {
                status = `Мат! Победили ${game.turn() === 'w' ? 'Черные' : 'Белые'} 🎉`;
            } else if (game.in_draw()) {
                status = 'Ничья!';
            } else {
                status = `Ход: ${moveColor}`;
                if (game.in_check()) status += ' (Шах!)';
            }
            document.getElementById('status').textContent = status;
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            lastMove = null;
            renderBoard();
        }

        renderBoard();
    </script>
