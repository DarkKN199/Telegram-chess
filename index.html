<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматы Дуэль</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #ffffff;
            --text-secondary: #98989f;
            --light-square: #ebecd0;
            --dark-square: #739552;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
        }

        h2 {
            margin: 0 0 5px 0;
            font-size: 22px;
            font-weight: 600;
        }

        #status {
            font-size: 14px;
            color: var(--text-secondary);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 340px;
            height: 340px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            user-select: none;
        }

        .light { background-color: var(--light-square); }
        .dark { background-color: var(--dark-square); }
        .selected { background-color: rgba(255, 255, 0, 0.6) !important; }

        .btn {
            background-color: #3b3b4f;
            color: var(--text-color);
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Шахматы Дуэль</h2>
        <div id="status">Ход: Белые</div>
    </div>

    <div id="board"></div>

    <div>
        <button class="btn" onclick="resetGame()">Новая игра</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let game = new Chess();
        let selectedSquare = null;

        const pieceSymbols = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            const board = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareEl = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
                    
                    const file = 'abcdefgh'[c];
                    const rank = 8 - r;
                    const squareCoord = file + rank;

                    if (selectedSquare === squareCoord) {
                        squareEl.classList.add('selected');
                    }

                    const piece = board[r][c];
                    if (piece) {
                        let symbolKey = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                        squareEl.textContent = pieceSymbols[symbolKey];
                        // Делаем белые фигуры белыми, а черные — темно-темными для контраста
                        if (piece.color === 'w') {
                            squareEl.style.color = '#ffffff';
                            squareEl.style.textShadow = '0 2px 4px rgba(0,0,0,0.9)';
                        } else {
                            squareEl.style.color = '#111111';
                            squareEl.style.textShadow = '0 1px 2px rgba(255,255,255,0.3)';
                        }
                    }

                    squareEl.onclick = () => onSquareClick(squareCoord);
                    boardEl.appendChild(squareEl);
                }
            }
            updateStatus();
        }

        function onSquareClick(square) {
            if (selectedSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    renderBoard();
                }
            } else {
                const move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                selectedSquare = null;
                if (move === null) {
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                    }
                }
                renderBoard();
            }
        }

        function updateStatus() {
            let status = '';
            let moveColor = game.turn() === 'w' ? 'Белые' : 'Черные';

            if (game.in_checkmate()) {
                status = `Мат! Победили ${game.turn() === 'w' ? 'Черные' : 'Белые'} 🎉`;
            } else if (game.in_draw()) {
                status = 'Ничья!';
            } else {
                status = `Ход: ${moveColor}`;
                if (game.in_check()) status += ' (Шах!)';
            }
            document.getElementById('status').textContent = status;
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            renderBoard();
        }

        renderBoard();
    </script>
</body>
</html>
