<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы Дуэль (3D Render)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --light-sq-start: #e6eff6;
            --light-sq-end: #c2d4e4;
            --dark-sq-start: #7da3c6;
            --dark-sq-end: #567b9d;
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --coord-color: #999999;
            --text-color: #ffffff;
            --text-secondary: #98989f;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
            position: fixed;
        }

        .header {
            text-align: center;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        h2 {
            margin: 0 0 2px 0;
            font-size: 18px;
            font-weight: 600;
        }

        #status {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Обертка для доски и координат */
        .board-wrapper {
            display: grid;
            grid-template-columns: 24px 1fr 24px;
            grid-template-rows: 24px 1fr 24px;
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        .coords {
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: var(--coord-color);
            font-weight: bold;
            font-size: 12px;
            user-select: none;
            text-transform: lowercase;
        }

        .coords-top, .coords-bottom { grid-column: 2; }
        .coords-left, .coords-right { 
            grid-row: 2; 
            flex-direction: column; 
            justify-content: space-around;
        }
        
        .coords span {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Сама доска */
        .chessboard {
            grid-column: 2;
            grid-row: 2;
            display: grid;
            grid-template-columns: repeat(8, 38px);
            grid-template-rows: repeat(8, 38px);
            width: 304px;
            height: 304px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 1px solid #111;
        }

        .square {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        .square.light { 
            background: linear-gradient(135deg, var(--light-sq-start) 0%, var(--light-sq-end) 100%);
            box-shadow: inset 1px 1px 0px rgba(255,255,255,0.8), inset -1px -1px 2px rgba(0,0,0,0.15);
        }
        
        .square.dark { 
            background: linear-gradient(135deg, var(--dark-sq-start) 0%, var(--dark-sq-end) 100%);
            box-shadow: inset 1px 1px 0px rgba(255,255,255,0.3), inset -1px -1px 2px rgba(0,0,0,0.3);
        }

        /* Подсветка ходов и выбора */
        .square.highlight::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(153, 185, 114, 0.85);
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        /* Контейнер для фигуры */
        .piece-container {
            width: 92%;
            height: 92%;
            z-index: 10;
            filter: drop-shadow(3px 5px 4px rgba(0,0,0,0.45));
            pointer-events: none;
        }

        svg.piece {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            margin-top: 14px;
            flex-shrink: 0;
        }

        .btn {
            background-color: #3b3b4f;
            color: var(--text-color);
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

<div class="header">
    <h2>Шахматы Дуэль</h2>
    <div id="status">Ход: Белые</div>
</div>

<div class="board-wrapper">
    <div class="coords coords-top"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>
    <div class="coords coords-left"><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span></div>
    <div class="chessboard" id="board"></div>
    <div class="coords coords-right"><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span></div>
    <div class="coords coords-bottom"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>
</div>

<div class="controls">
    <button class="btn" onclick="resetGame()">Новая игра</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let game = new Chess();
    let selectedSquare = null;
    let lastMove = null;

    // Детализированные 3D SVG фигуры
    const pieces = {
        'wP': `<svg viewBox="0 0 45 45" class="piece"><defs><linearGradient id="wP-shadow" x1="20%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#ffffff"/><stop offset="100%" stop-color="#d0d0d0"/></linearGradient></defs><g stroke="#111" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M 15 36 L 30 36 L 28 31 L 17 31 Z" fill="url(#wP-shadow)"/><path d="M 17 31 C 17 26 20 24 22.5 24 C 25 24 28 26 28 31 Z" fill="url(#wP-shadow)"/><path d="M 18 24 L 27 24 L 25 21 L 20 21 Z" fill="url(#wP-shadow)"/><circle cx="22.5" cy="16" r="5.5" fill="url(#wP-shadow)"/></g><path d="M 18 16 C 18 13 20 11 22.5 11" stroke="#ddd" stroke-width="1.5" fill="none"/></svg>`,
        'wR': `<svg viewBox="0 0 45 45" class="piece"><defs><linearGradient id="wR-shadow" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="70%" stop-color="#f0f0f0"/><stop offset="100%" stop-color="#c0c0c0"/></linearGradient></defs><g stroke="#111" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="url(#wR-shadow)"><path d="M 12 37 L 33 37 L 33 33 L 12 33 Z"/><path d="M 13 33 L 32 33 L 31 28 L 14 28 Z"/><path d="M 15 28 L 30 28 L 30 13 L 15 13 Z"/><path d="M 15 13 L 15 8 L 18 8 L 18 11 L 21 11 L 21 8 L 24 8 L 24 11 L 27 11 L 27 8 L 30 8 L 30 13 Z"/></g><path d="M 16 28 L 16 14" stroke="#ddd" stroke-width="1.5" fill="none"/></svg>`,
        'wN': `<svg viewBox="0 0 45 45" class="piece"><defs><linearGradient id="wN-shadow" x1="10%" y1="10%" x2="90%" y2="90%"><stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#f5f5f5"/><stop offset="100%" stop-color="#c0c0c0"/></linearGradient></defs><g stroke="#111" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="url(#wN-shadow)"><path d="M 12 37 L 33 37 L 32 33 L 13 33 Z"/><path d="M 14 33 C 14 25 15 18 19 13 C 21 10 24 9 27 11 C 30 13 31 17 29 21 C 27 25 24 28 25 33 Z"/><path d="M 19 13 L 21 7 L 24 10"/><path d="M 19 18 C 22 18 25 20 26 23 C 26 25 24 26 22 26"/></g><circle cx="23" cy="16" r="1" fill="#111"/><path d="M 16 32 C 16 25 17 19 20 14" stroke="#ddd" stroke-width="1.5" fill="none"/><path d="M 22 24 C 24 24 25 25 25 26" stroke="#111" stroke-width="1" fill="none"/></svg>`,
        'wB': `<svg viewBox="0 0 45 45" class="piece"><defs><linearGradient id="wB-shadow" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="70%" stop-color="#f0f0f0"/><stop offset="100%" stop-color="#c0c0c0"/></linearGradient></defs><g stroke="#111" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="url(#wB-shadow)"><path d="M 12 37 L 33 37 L 33 34 L 12 34 Z"/><path d="M 14 34 C 14 29 18 26 22.5 26 C 27 26 31 29 31 34 Z"/><path d="M 18 26 C 18 20 20 15 22.5 15 C 25 15 27 20 27 26 Z"/><path d="M 21 15 C 21 12 22 10 22.5 10 C 23 10 24 12 24 15"/><circle cx="22.5" cy="7" r="2.5"/><path d="M 20 22 L 25 18" stroke-width="1.5" stroke-linecap="round"/></g><path d="M 16 33 C 16 28 19 26 21 26" stroke="#ddd" stroke-width="1.5" fill="none"/></svg>`,
        'wQ': `<svg viewBox="0 0 45 45" class="piece"><defs><linearGradient id="wQ-shadow" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="70%" stop-color="#f0f0f0"/><stop offset="100%" stop-color="#c0c0c0"/></linearGradient></defs><g stroke="#111" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="url(#wQ-shadow)"><path d="M 12 37 L 33 37 L 33 34 L 12 34 Z"/><path d="M 14 34 C 14 27 17 22 22.5 22 C 28 22 31 27 31 34 Z"/><path d="M 14 22 L 15 12 L 18 17 L 20 9 L 22.5 16 L 25 9 L 27 17 L 30 12 L 31 22 Z"/><circle cx="15" cy="11" r="1.5"/><circle cx="20" cy="8" r="1.5"/><circle cx="22.5" cy="15" r="1.5"/><circle cx="25" cy="8" r="1.5"/><circle cx="30" cy="11" r="1.5"/></g><path d="M 16 33 C 16 27 18 23 21 23" stroke="#ddd" stroke-width="1.5" fill="none"/><path d="M 22.5 17 L 22.5 22" stroke="#111" stroke-width="1" fill="none"/></svg>`,
        'wK': `<svg viewBox="0 0 45 45" class="piece"><defs><linearGradient id="wK-shadow" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="70%" stop-color="#f0f0f0"/><stop offset="100%" stop-color="#c0c0c0"/></linearGradient></defs><g stroke="#111" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="url(#wK-shadow)"><path d="M 12 37 L 33 37 L 33 34 L 12 34 Z"/><path d="M 14 34 C 14 27 17 22 22.5 22 C 28 22 31 27 31 34 Z"/><path d="M 15 22 C 15 17 18 14 22.5 14 C 27 14 30 17 30 22"/><path d="M 22.5 14 L 22.5 6 M 19.5 9 L 25.5 9" stroke-width="2"/></g><path d="M 16 33 C 16 27 18 23 21 23" stroke="#ddd" stroke-width="1.5" fill="none"/><path d="M 17 21 C 17 17 19 15 22 15" stroke="#ddd" stroke-width="1.5" fill="none"/></svg>`,

        'bP': `<svg viewBox="0 0 45 45" class="piece"><defs><linearGradient id="bP-high" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4a4a4a"/><stop offset="40%" stop-color="#2a2a2a"/><stop offset="100%" stop-color="#151515"/></linearGradient></defs><g stroke="#000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="url(#bP-high)"><path d="M 15 36 L 30 36 L 28 31 L 17 31 Z"/><path d="M 17 31 C 17 26 20 24 22.5 24 C 25 24 28 26 28 31 Z"/><path d="M 18 24 L 27 24 L 25 21 L 20 21 Z"/><circle cx="22.5" cy="16" r="5.5"/></g><path d="M 18 16 C 18 13 20 11 22.5 11" stroke="#888" stroke-width="1.5" fill="none" opacity="0.8"/><path d="M 18 30 L 20 26" stroke="#666" stroke-width="1" fill="none"/></svg>`,
        'bR': `<svg viewBox="0 0 45 45" class="piece"><defs><linearGradient id="bR-high" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#444"/><stop offset="30%" stop-color="#222"/><stop offset="100%" stop-color="#111"/></linearGradient></defs><g stroke="#000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="url(#bR-high)"><path d="M 12 37 L 33 37 L 33 33 L 12 33 Z"/><path d="M 13 33 L 32 33 L 31 28 L 14 28 Z"/><path d="M 15 28 L 30 28 L 30 13 L 15 13 Z"/><path d="M 15 13 L 15 8 L 18 8 L 18 11 L 21 11 L 21 8 L 24 8 L 24 11 L 27 11 L 27 8 L 30 8 L 30 13 Z"/></g><path d="M 16 28 L 16 14" stroke="#777" stroke-width="1.5" fill="none" opacity="0.6"/><path d="M 15 35 L 15 34" stroke="#777" stroke-width="1.5" fill="none"/></svg>`,
        'bN': `<svg viewBox="0 0 45 45" class="piece"><defs><linearGradient id="bN-high" x1="10%" y1="10%" x2="90%" y2="90%"><stop offset="0%" stop-color="#555"/><stop offset="40%" stop-color="#2a2a2a"/><stop offset="100%" stop-color="#151515"/></linearGradient></defs><g stroke="#000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="url(#bN-high)"><path d="M 12 37 L 33 37 L 32 33 L 13 33 Z"/><path d="M 14 33 C 14 25 15 18 19 13 C 21 10 24 9 27 11 C 30 13 31 17 29 21 C 27 25 24 28 25 33 Z"/><path d="M 19 13 L 21 7 L 24 10"/><path d="M 19 18 C 22 18 25 20 26 23 C 26 25 24 26 22 26"/></g><circle cx="23" cy="16" r="1" fill="#888"/><path d="M 16 32 C 16 25 17 19 20 14" stroke="#888" stroke-width="1.5" fill="none" opacity="0.7"/><path d="M 22 24 C 24 24 25 25 25 26" stroke="#000" stroke-width="1" fill="none"/></svg>`,
        'bB': `<svg viewBox="0 0 45 45" class="piece"><defs><linearGradient id="bB-high" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#555"/><stop offset="40%" stop-color="#222"/><stop offset="100%" stop-color="#151515"/></linearGradient></defs><g stroke="#000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="url(#bB-high)"><path d="M 12 37 L 33 37 L 33 34 L 12 34 Z"/><path d="M 14 34 C 14 29 18 26 22.5 26 C 27 26 31 29 31 34 Z"/><path d="M 18 26 C 18 20 20 15 22.5 15 C 25 15 27 20 27 26 Z"/><path d="M 21 15 C 21 12 22 10 22.5 10 C 23 10 24 12 24 15"/><circle cx="22.5" cy="7" r="2.5"/><path d="M 20 22 L 25 18" stroke-width="1.5" stroke-linecap="round" stroke="#fff"/></g><path d="M 16 33 C 16 28 19 26 21 26" stroke="#888" stroke-width="1.5" fill="none" opacity="0.6"/></svg>`,
        'bQ': `<svg viewBox="0 0 45 45" class="piece"><defs><linearGradient id="bQ-high" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#555"/><stop offset="40%" stop-color="#222"/><stop offset="100%" stop-color="#151515"/></linearGradient></defs><g stroke="#000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="url(#bQ-high)"><path d="M 12 37 L 33 37 L 33 34 L 12 34 Z"/><path d="M 14 34 C 14 27 17 22 22.5 22 C 28 22 31 27 31 34 Z"/><path d="M 14 22 L 15 12 L 18 17 L 20 9 L 22.5 16 L 25 9 L 27 17 L 30 12 L 31 22 Z"/><circle cx="15" cy="11" r="1.5" fill="#fff"/><circle cx="20" cy="8" r="1.5" fill="#fff"/><circle cx="22.5" cy="15" r="1.5" fill="#fff"/><circle cx="25" cy="8" r="1.5" fill="#fff"/><circle cx="30" cy="11" r="1.5" fill="#fff"/></g><path d="M 16 33 C 16 27 18 23 21 23" stroke="#888" stroke-width="1.5" fill="none" opacity="0.6"/><path d="M 22.5 17 L 22.5 22" stroke="#fff" stroke-width="1" fill="none" opacity="0.8"/></svg>`,
        'bK': `<svg viewBox="0 0 45 45" class="piece"><defs><linearGradient id="bK-high" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#555"/><stop offset="40%" stop-color="#222"/><stop offset="100%" stop-color="#151515"/></linearGradient></defs><g stroke="#000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="url(#bK-high)"><path d="M 12 37 L 33 37 L 33 34 L 12 34 Z"/><path d="M 14 34 C 14 27 17 22 22.5 22 C 28 22 31 27 31 34 Z"/><path d="M 15 22 C 15 17 18 14 22.5 14 C 27 14 30 17 30 22"/></g><path d="M 22.5 14 L 22.5 6 M 19.5 9 L 25.5 9" stroke="#666" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 22.5 14 L 22.5 6 M 19.5 9 L 25.5 9" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M 16 33 C 16 27 18 23 21 23" stroke="#888" stroke-width="1.5" fill="none" opacity="0.6"/><path d="M 17 21 C 17 17 19 15 22 15" stroke="#888" stroke-width="1.5" fill="none" opacity="0.6"/></svg>`
    };

    function renderBoard() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';
        const board = game.board();

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const squareEl = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
                
                const file = 'abcdefgh'[c];
                const rank = 8 - r;
                const squareCoord = file + rank;

                // Подсветка ходов и выбора
                if (lastMove && (lastMove.from === squareCoord || lastMove.to === squareCoord)) {
                    squareEl.classList.add('highlight');
                }
                if (selectedSquare === squareCoord) {
                    squareEl.classList.add('highlight');
                }

                // Отрисовка фигур
                const piece = board[r][c];
                if (piece) {
                    const pieceKey = piece.color + piece.type.toUpperCase();
                    if (pieces[pieceKey]) {
                        const container = document.createElement('div');
                        container.className = 'piece-container';
                        container.innerHTML = pieces[pieceKey];
                        squareEl.appendChild(container);
                    }
                }

                squareEl.onclick = () => onSquareClick(squareCoord);
                boardEl.appendChild(squareEl);
            }
        }
        updateStatus();
    }

    function onSquareClick(square) {
        if (selectedSquare === null) {
            const piece = game.get(square);
            if (piece && piece.color === game.turn()) {
                selectedSquare = square;
                renderBoard();
            }
        } else {
            const move = game.move({
                from: selectedSquare,
                to: square,
                promotion: 'q'
            });

            if (move !== null) {
                lastMove = move;
                selectedSquare = null;
            } else {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                } else {
                    selectedSquare = null;
                }
            }
            renderBoard();
        }
    }

    function updateStatus() {
        let status = '';
        let moveColor = game.turn() === 'w' ? 'Белые' : 'Черные';

        if (game.in_checkmate()) {
            status = `Мат! Победили ${game.turn() === 'w' ? 'Черные' : 'Белые'} 🎉`;
        } else if (game.in_draw()) {
            status = 'Ничья!';
        } else {
            status = `Ход: ${moveColor}`;
            if (game.in_check()) status += ' (Шах!)';
        }
        document.getElementById('status').textContent = status;
    }

    function resetGame() {
        game.reset();
        selectedSquare = null;
        lastMove = null;
        renderBoard();
    }

    renderBoard();
</script>
</body>
</html>
