<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы Дуэль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --light-sq-top: #e4eef5;
            --light-sq-bottom: #c8dae8;
            --dark-sq-top: #7ea6ce;
            --dark-sq-bottom: #628eb8;
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #ffffff;
            --text-secondary: #98989f;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
            position: fixed;
        }

        .header {
            text-align: center;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        h2 {
            margin: 0 0 2px 0;
            font-size: 18px;
            font-weight: 600;
        }

        #status {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .board-wrapper {
            position: relative;
            padding: 28px;
            background-color: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 38px);
            grid-template-rows: repeat(8, 38px);
            width: 304px;
            height: 304px;
            border: 2px solid #111;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .square {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        .square.light { 
            background: linear-gradient(135deg, var(--light-sq-top), var(--light-sq-bottom));
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.6), inset -1px -1px 3px rgba(0,0,0,0.15);
        }
        .square.dark { 
            background: linear-gradient(135deg, var(--dark-sq-top), var(--dark-sq-bottom));
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.3), inset -1px -1px 3px rgba(0,0,0,0.25);
        }
        
        .square.highlight-dark::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #41705b;
            mix-blend-mode: multiply;
            opacity: 0.8;
            pointer-events: none;
        }
        .square.highlight-light::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #99ba72;
            mix-blend-mode: multiply;
            opacity: 0.8;
            pointer-events: none;
        }

        .piece {
            width: 90%;
            height: 90%;
            z-index: 10;
            filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.45));
            pointer-events: none;
        }

        .coords {
            position: absolute;
            display: flex;
            color: var(--text-secondary);
            font-weight: bold;
            font-size: 12px;
        }
        .coords.files-top { top: 6px; left: 28px; right: 28px; justify-content: space-around; }
        .coords.files-bottom { bottom: 6px; left: 28px; right: 28px; justify-content: space-around; }
        .coords.ranks-left { top: 28px; bottom: 28px; left: 6px; flex-direction: column; justify-content: space-around; }
        .coords.ranks-right { top: 28px; bottom: 28px; right: 6px; flex-direction: column; justify-content: space-around; }
        
        .coords span {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            opacity: 0.8;
        }
        .coords.ranks-left span, .coords.ranks-right span {
            width: 16px;
        }

        .controls {
            margin-top: 14px;
            flex-shrink: 0;
        }

        .btn {
            background-color: #3b3b4f;
            color: var(--text-color);
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

<div class="header">
    <h2>Шахматы Дуэль</h2>
    <div id="status">Ход: Белые</div>
</div>

<div class="board-wrapper">
    <div class="coords files-top"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>
    <div class="coords files-bottom"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>
    <div class="coords ranks-left"><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span></div>
    <div class="coords ranks-right"><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span></div>
    <div class="chessboard" id="board"></div>
</div>

<div class="controls">
    <button class="btn" onclick="resetGame()">Новая игра</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let game = new Chess();
    let selectedSquare = null;
    let lastMove = null;

    // SVG фигуры в стиле Kosal
    const pieces = {
        'wK': `<svg viewBox="0 0 45 45" class="piece"><g fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M 11,38 L 34,38 L 34,35 L 11,35 Z M 13,35 L 32,35 L 32,32 L 13,32 Z"/><path d="M 13,32 C 13,22 16,18 22.5,18 C 29,18 32,22 32,32"/><path d="M 16,18 C 16,12 18,9 22.5,9 C 27,9 29,12 29,18"/><path d="M 22.5,9 L 22.5,4 M 20,6 L 25,6" stroke-width="2.5"/><path d="M 22.5,22 L 24.5,24 L 22.5,26 L 20.5,24 Z" fill="#000" stroke="none"/></g><path d="M 14,31 L 14,24 C 14,20 16,18 20,18" stroke="#e0e0e0" stroke-width="1.5" fill="none"/></svg>`,
        'wQ': `<svg viewBox="0 0 45 45" class="piece"><g fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M 11,38 L 34,38 L 32,34 L 13,34 Z"/><path d="M 13,34 C 13,24 16,20 22.5,20 C 29,20 32,24 32,34"/><path d="M 13,20 L 15,10 L 19,18 L 22.5,8 L 26,18 L 30,10 L 32,20 Z"/><circle cx="15" cy="9" r="1.5"/><circle cx="22.5" cy="7" r="1.5"/><circle cx="30" cy="9" r="1.5"/><circle cx="19" cy="17.5" r="1.5"/><circle cx="26" cy="17.5" r="1.5"/><path d="M 14,30 C 14,24 16,21 20,21" stroke="#e0e0e0" stroke-width="1.5" fill="none"/></g></svg>`,
        'wR': `<svg viewBox="0 0 45 45" class="piece"><g fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M 11,38 L 34,38 L 34,35 L 11,35 Z M 13,35 L 32,35 L 32,32 L 13,32 Z"/><path d="M 13,32 L 32,32 L 32,14 L 13,14 Z"/><path d="M 13,14 L 13,8 L 16,8 L 16,11 L 19,11 L 19,8 L 26,8 L 26,11 L 29,11 L 29,8 L 32,8 L 32,14 Z"/><path d="M 13,29 L 32,29" stroke-width="1.5"/><path d="M 14,31 L 14,15" stroke="#e0e0e0" stroke-width="2" fill="none"/></g></svg>`,
        'wB': `<svg viewBox="0 0 45 45" class="piece"><g fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M 11,38 L 34,38 L 32,33 L 13,33 Z"/><path d="M 13,33 C 13,24 18,20 20,20 C 21,20 22,24 22.5,27 C 23,24 24,20 25,20 C 27,20 32,24 32,33 Z"/><path d="M 18,20 C 18,14 20,10 22.5,10 C 25,10 27,14 27,20 Z"/><circle cx="22.5" cy="8" r="2.5"/><path d="M 21,18 L 25,15" stroke-width="1.5" stroke-linecap="round"/><path d="M 14,30 C 14,24 18,21 20,21" stroke="#e0e0e0" stroke-width="1.5" fill="none"/></g></svg>`,
        'wN': `<svg viewBox="0 0 45 45" class="piece"><g fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M 11,38 L 34,38 L 34,35 L 11,35 Z"/><path d="M 13,35 L 14,25 C 15,18 18,12 23,10 C 27,8 30,10 31,14 C 32,18 28,22 26,24 C 24,26 24,30 25,35 Z"/><path d="M 23,10 L 25,6 L 27,9"/><path d="M 20,16 L 23,16" stroke-width="1.5" stroke-linecap="round"/><path d="M 22,22 L 26,22" stroke-width="1.5"/><path d="M 15,32 C 15,25 18,18 22,15" stroke="#e0e0e0" stroke-width="1.5" fill="none"/></g></svg>`,
        'wP': `<svg viewBox="0 0 45 45" class="piece"><g fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M 12,38 L 33,38 L 33,35 L 12,35 Z"/><path d="M 14,35 C 14,28 18,26 22.5,26 C 27,26 31,28 31,35 Z"/><path d="M 18,26 C 18,22 20,20 22.5,20 C 25,20 27,22 27,26 Z"/><circle cx="22.5" cy="16" r="5"/><path d="M 14,34 C 14,28 18,27 21,27" stroke="#e0e0e0" stroke-width="1.5" fill="none"/></g></svg>`,

        'bK': `<svg viewBox="0 0 45 45" class="piece"><g fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M 11,38 L 34,38 L 34,35 L 11,35 Z M 13,35 L 32,35 L 32,32 L 13,32 Z"/><path d="M 13,32 C 13,22 16,18 22.5,18 C 29,18 32,22 32,32"/><path d="M 16,18 C 16,12 18,9 22.5,9 C 27,9 29,12 29,18"/><path d="M 22.5,9 L 22.5,4 M 20,6 L 25,6" stroke="#777" stroke-width="2.5" stroke-linecap="square"/><path d="M 22.5,9 L 22.5,4 M 20,6 L 25,6" stroke="#000" stroke-width="1.2" stroke-linecap="square"/><path d="M 22.5,22 L 24.5,24 L 22.5,26 L 20.5,24 Z" fill="#fff" stroke="none"/></g><path d="M 14,31 L 14,24 C 14,20 16,18 20,18" stroke="#555" stroke-width="1.5" fill="none"/><path d="M 17,17 C 17,13 19,11 22,10" stroke="#555" stroke-width="1.5" fill="none"/></svg>`,
        'bQ': `<svg viewBox="0 0 45 45" class="piece"><g fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M 11,38 L 34,38 L 32,34 L 13,34 Z"/><path d="M 13,34 C 13,24 16,20 22.5,20 C 29,20 32,24 32,34"/><path d="M 13,20 L 15,10 L 19,18 L 22.5,8 L 26,18 L 30,10 L 32,20 Z"/><circle cx="15" cy="9" r="1.5" fill="#fff"/><circle cx="22.5" cy="7" r="1.5" fill="#fff"/><circle cx="30" cy="9" r="1.5" fill="#fff"/><circle cx="19" cy="17.5" r="1.5" fill="#fff"/><circle cx="26" cy="17.5" r="1.5" fill="#fff"/><path d="M 14,30 C 14,24 16,21 20,21" stroke="#fff" stroke-width="1.5" fill="none"/><path d="M 22.5,9 L 22.5,18" stroke="#fff" stroke-width="1" fill="none"/></g></svg>`,
        'bR': `<svg viewBox="0 0 45 45" class="piece"><g fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M 11,38 L 34,38 L 34,35 L 11,35 Z M 13,35 L 32,35 L 32,32 L 13,32 Z"/><path d="M 13,32 L 32,32 L 32,14 L 13,14 Z"/><path d="M 13,14 L 13,8 L 16,8 L 16,11 L 19,11 L 19,8 L 26,8 L 26,11 L 29,11 L 29,8 L 32,8 L 32,14 Z"/><path d="M 13,29 L 32,29" stroke="#555" stroke-width="1.5"/><path d="M 14,31 L 14,15" stroke="#555" stroke-width="2" fill="none"/></g></svg>`,
        'bB': `<svg viewBox="0 0 45 45" class="piece"><g fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M 11,38 L 34,38 L 32,33 L 13,33 Z"/><path d="M 13,33 C 13,24 18,20 20,20 C 21,20 22,24 22.5,27 C 23,24 24,20 25,20 C 27,20 32,24 32,33 Z"/><path d="M 18,20 C 18,14 20,10 22.5,10 C 25,10 27,14 27,20 Z"/><circle cx="22.5" cy="8" r="2.5"/><path d="M 21,18 L 25,15" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M 14,30 C 14,24 18,21 20,21" stroke="#555" stroke-width="1.5" fill="none"/></g></svg>`,
        'bN': `<svg viewBox="0 0 45 45" class="piece"><g fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M 11,38 L 34,38 L 34,35 L 11,35 Z"/><path d="M 13,35 L 14,25 C 15,18 18,12 23,10 C 27,8 30,10 31,14 C 32,18 28,22 26,24 C 24,26 24,30 25,35 Z"/><path d="M 23,10 L 25,6 L 27,9"/><path d="M 20,16 L 23,16" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><path d="M 22,22 L 26,22" stroke="#fff" stroke-width="1.5"/><path d="M 15,32 C 15,25 18,18 22,15" stroke="#555" stroke-width="1.5" fill="none"/></g></svg>`,
        'bP': `<svg viewBox="0 0 45 45" class="piece"><g fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M 12,38 L 33,38 L 33,35 L 12,35 Z"/><path d="M 14,35 C 14,28 18,26 22.5,26 C 27,26 31,28 31,35 Z"/><path d="M 18,26 C 18,22 20,20 22.5,20 C 25,20 27,22 27,26 Z"/><circle cx="22.5" cy="16" r="5"/><path d="M 14,34 C 14,28 18,27 21,27" stroke="#555" stroke-width="1.5" fill="none"/></g></svg>`
    };

    function renderBoard() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';
        const board = game.board();

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const squareEl = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
                
                const file = 'abcdefgh'[c];
                const rank = 8 - r;
                const squareCoord = file + rank;

                // Подсветка ходов
                if (lastMove && (lastMove.from === squareCoord || lastMove.to === squareCoord)) {
                    squareEl.classList.add(isLight ? 'highlight-light' : 'highlight-dark');
                }
                if (selectedSquare === squareCoord) {
                    squareEl.classList.add(isLight ? 'highlight-light' : 'highlight-dark');
                }

                // Отрисовка фигур из chess.js
                const piece = board[r][c];
                if (piece) {
                    const pieceKey = piece.color + piece.type.toUpperCase();
                    if (pieces[pieceKey]) {
                        squareEl.innerHTML = pieces[pieceKey];
                    }
                }

                squareEl.onclick = () => onSquareClick(squareCoord);
                boardEl.appendChild(squareEl);
            }
        }
        updateStatus();
    }

    function onSquareClick(square) {
        if (selectedSquare === null) {
            const piece = game.get(square);
            if (piece && piece.color === game.turn()) {
                selectedSquare = square;
                renderBoard();
            }
        } else {
            const move = game.move({
                from: selectedSquare,
                to: square,
                promotion: 'q'
            });

            if (move !== null) {
                lastMove = move;
                selectedSquare = null;
            } else {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                } else {
                    selectedSquare = null;
                }
            }
            renderBoard();
        }
    }

    function updateStatus() {
        let status = '';
        let moveColor = game.turn() === 'w' ? 'Белые' : 'Черные';

        if (game.in_checkmate()) {
            status = `Мат! Победили ${game.turn() === 'w' ? 'Черные' : 'Белые'} 🎉`;
        } else if (game.in_draw()) {
            status = 'Ничья!';
        } else {
            status = `Ход: ${moveColor}`;
            if (game.in_check()) status += ' (Шах!)';
        }
        document.getElementById('status').textContent = status;
    }

    function resetGame() {
        game.reset();
        selectedSquare = null;
        lastMove = null;
        renderBoard();
    }

    renderBoard();
</script>
</body>
</html>
