<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы Дуэль</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #ffffff;
            --text-secondary: #98989f;
            /* Точная палитра со скриншота */
            --light-square: #dee3e6;
            --dark-square: #6496c8;
            --highlight-move: #8fb53e; /* Салатовый цвет подсветки хода */
            --highlight-select: #a7cf49;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
            position: fixed;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        h2 {
            margin: 0 0 4px 0;
            font-size: 20px;
            font-weight: 600;
        }

        #status {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .board-container {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            flex-shrink: 0;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 40px);
            grid-template-rows: repeat(8, 40px);
            width: 320px;
            height: 320px;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .square {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            flex-shrink: 0;
        }

        .light { background-color: var(--light-square); }
        .dark { background-color: var(--dark-square); }
        
        /* Подсветка ходов как на скриншоте */
        .selected { background-color: var(--highlight-select) !important; }
        .last-move { background-color: var(--highlight-move) !important; }

        /* Координаты на доске */
        .coord-rank {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
        }

        .coord-file {
            position: absolute;
            bottom: 2px;
            left: 4px;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
        }

        .light .coord-rank, .light .coord-file { color: var(--dark-square); }
        .dark .coord-rank, .dark .coord-file { color: var(--light-square); }

        .controls {
            margin-top: 16px;
            flex-shrink: 0;
        }

        .btn {
            background-color: #3b3b4f;
            color: var(--text-color);
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Шахматы Дуэль</h2>
        <div id="status">Ход: Белые</div>
    </div>

    <div class="board-container">
        <div id="board"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="resetGame()">Новая игра</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let game = new Chess();
        let selectedSquare = null;
        let lastMove = null;

        const pieceSymbols = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            const board = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareEl = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
                    
                    const file = 'abcdefgh'[c];
                    const rank = 8 - r;
                    const squareCoord = file + rank;

                    // Подсветка последнего хода (салатовая)
                    if (lastMove && (lastMove.from === squareCoord || lastMove.to === squareCoord)) {
                        squareEl.classList.add('last-move');
                    }

                    // Подсветка выбранной фигуры
                    if (selectedSquare === squareCoord) {
                        squareEl.classList.add('selected');
                    }

                    // Координаты цифр (справа)
                    if (c === 7) {
                        const rankEl = document.createElement('span');
                        rankEl.className = 'coord-rank';
                        rankEl.textContent = rank;
                        squareEl.appendChild(rankEl);
                    }

                    // Координаты букв (снизу)
                    if (r === 7) {
                        const fileEl = document.createElement('span');
                        fileEl.className = 'coord-file';
                        fileEl.textContent = file;
                        squareEl.appendChild(fileEl);
                    }

                    // Фигуры
                    const piece = board[r][c];
                    if (piece) {
                        const symbolKey = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                        const pieceSpan = document.createElement('span');
                        pieceSpan.textContent = pieceSymbols[symbolKey];
                        
                        if (piece.color === 'w') {
                            pieceSpan.style.color = '#ffffff';
                            pieceSpan.style.textShadow = '0 0 2px #000, 0 1px 3px rgba(0,0,0,0.8)';
                        } else {
                            pieceSpan.style.color = '#000000';
                            pieceSpan.style.textShadow = '0 0 1px #fff';
                        }
                        squareEl.appendChild(pieceSpan);
                    }

                    squareEl.onclick = () => onSquareClick(squareCoord);
                    boardEl.appendChild(squareEl);
                }
            }
            updateStatus();
        }

        function onSquareClick(square) {
            if (selectedSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    renderBoard();
                }
            } else {
                const move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move !== null) {
                    lastMove = move; // Запоминаем последний ход для салатовой подсветки
                    selectedSquare = null;
                } else {
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                    } else {
                        selectedSquare = null;
                    }
                }
                renderBoard();
            }
        }

        function updateStatus() {
            let status = '';
            let moveColor = game.turn() === 'w' ? 'Белые' : 'Черные';

            if (game.in_checkmate()) {
                status = `Мат! Победили ${game.turn() === 'w' ? 'Черные' : 'Белые'} 🎉`;
            } else if (game.in_draw()) {
                status = 'Ничья!';
            } else {
                status = `Ход: ${moveColor}`;
                if (game.in_check()) status += ' (Шах!)';
            }
            document.getElementById('status').textContent = status;
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            lastMove = null;
            renderBoard();
        }

        renderBoard();
    </script>
</body>
</html>
