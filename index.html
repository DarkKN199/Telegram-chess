<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы — Telegram Mini App</title>
    <!-- Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Стили с версией для сброса кэша -->
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <!-- Верхняя панель: Статус, материал и история ходов -->
    <div class="top-panel">
        <div class="status-bar">
            <span id="status">Ход: Белые</span>
            <div class="material-container">
                <span id="material-diff"></span>
                <span class="captured-icons" id="captured-icons"></span>
            </div>
        </div>
        <div class="moves-ticker" id="moves-ticker"></div>
    </div>

    <!-- Шахматная доска -->
    <div class="board-container" id="board-container">
        <div class="chessboard" id="board"></div>
        
        <!-- Окно превращения пешки -->
        <div id="promotion-modal">
            <div class="promo-box" id="promo-options"></div>
        </div>
    </div>

    <!-- Панель управления -->
    <div class="controls">
        <button class="btn" onclick="GameController.reset()">Новая игра</button>
    </div>

    <!-- Скрипты движка и логики -->
    <script src="engine.js"></script>
    <script src="renderer.js"></script>
    <script src="animations.js"></script>
    <script src="game.js"></script>
</body>
</html>
