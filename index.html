<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы Дуэль</title>
    <link href="https://telegram.org/js/telegram-web-app.js" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --light-sq-top: #e6edf2;
            --light-sq-bottom: #c4d4e0;
            --dark-sq-top: #5d87ab;
            --dark-sq-bottom: #416b8f;
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #ffffff;
            --text-secondary: #98989f;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
            position: fixed;
        }

        .header {
            text-align: center;
            margin-bottom: 5px;
            flex-shrink: 0;
        }

        h2 {
            margin: 0 0 2px 0;
            font-size: 18px;
            font-weight: 600;
        }

        #status {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .board-wrapper {
            position: relative;
            padding: 24px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 38px);
            grid-template-rows: repeat(8, 38px);
            width: 304px;
            height: 304px;
            border: 1px solid #000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .square {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        .square.light { 
            background: linear-gradient(135deg, var(--light-sq-top), var(--light-sq-bottom));
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.4), inset -1px -1px 3px rgba(0,0,0,0.1);
        }
        .square.dark { 
            background: linear-gradient(135deg, var(--dark-sq-top), var(--dark-sq-bottom));
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.2), inset -1px -1px 3px rgba(0,0,0,0.3);
        }
        
        /* Подсветка ходов и выбора */
        .square.highlight-dark::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #437057;
            mix-blend-mode: multiply;
            opacity: 0.85;
            pointer-events: none;
        }
        .square.highlight-light::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #98b871;
            mix-blend-mode: multiply;
            opacity: 0.85;
            pointer-events: none;
        }

        .piece {
            width: 88%;
            height: 88%;
            z-index: 10;
            filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.4));
            pointer-events: none;
        }

        .coords {
            position: absolute;
            display: flex;
            color: var(--text-secondary);
            font-weight: bold;
            font-size: 11px;
        }
        .coords.files-top { top: 6px; left: 24px; right: 24px; justify-content: space-around; }
        .coords.files-bottom { bottom: 6px; left: 24px; right: 24px; justify-content: space-around; }
        .coords.ranks-left { top: 24px; bottom: 24px; left: 6px; flex-direction: column; justify-content: space-around; }
        .coords.ranks-right { top: 24px; bottom: 24px; right: 6px; flex-direction: column; justify-content: space-around; }
        
        .coords span {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }
        .coords.ranks-left span, .coords.ranks-right span {
            width: 14px;
        }

        .controls {
            margin-top: 14px;
            flex-shrink: 0;
        }

        .btn {
            background-color: #3b3b4f;
            color: var(--text-color);
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

<div class="header">
    <h2>Шахматы Дуэль</h2>
    <div id="status">Ход: Белые</div>
</div>

<div class="board-wrapper">
    <div class="coords files-top"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>
    <div class="coords files-bottom"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>

    <div class="coords ranks-right"><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span></div>
    <div class="chessboard" id="board"></div>
</div>

<div class="controls">
    <button class="btn" onclick="resetGame()">Новая игра</button>
</div>

    function renderBoard() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';
        const board = game.board();

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const squareEl = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
                
                const file = 'abcdefgh'[c];
                const rank = 8 - r;
                const squareCoord = file + rank;

                // Подсветка ходов
                if (lastMove && (lastMove.from === squareCoord || lastMove.to === squareCoord)) {
                    squareEl.classList.add(isLight ? 'highlight-light' : 'highlight-dark');
                }
                if (selectedSquare === squareCoord) {
                    squareEl.classList.add(isLight ? 'highlight-light' : 'highlight-dark');
                }

                // Расстановка фигур
                const piece = board[r][c];
                if (piece) {
                    const pieceKey = piece.color + piece.type.toUpperCase();
                    if (pieces[pieceKey]) {
                        squareEl.innerHTML = pieces[pieceKey];
                    }
                }

                squareEl.onclick = () => onSquareClick(squareCoord);
                boardEl.appendChild(squareEl);
            }
        }
        updateStatus();
    }

    function onSquareClick(square) {
        if (selectedSquare === null) {
            const piece = game.get(square);
            if (piece && piece.color === game.turn()) {
                selectedSquare = square;
                renderBoard();
            }
        } else {
            const move = game.move({
                from: selectedSquare,
                to: square,
                promotion: 'q'
            });

            if (move !== null) {
                lastMove = move;
                selectedSquare = null;
            } else {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                } else {
                    selectedSquare = null;
                }
            }
            renderBoard();
        }
    }

    function updateStatus() {
        let status = '';
        let moveColor = game.turn() === 'w' ? 'Белые' : 'Черные';

        if (game.in_checkmate()) {
            status = `Мат! Победили ${game.turn() === 'w' ? 'Черные' : 'Белые'} 🎉`;
        } else if (game.in_draw()) {
            status = 'Ничья!';
        } else {
            status = `Ход: ${moveColor}`;
            if (game.in_check()) status += ' (Шах!)';
        }
        document.getElementById('status').textContent = status;
    }

    function resetGame() {
        game.reset();
        selectedSquare = null;
        lastMove = null;
        renderBoard();
    }

    renderBoard();
</script>
</body>
</html>
