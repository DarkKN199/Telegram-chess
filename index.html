<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы Дуэль</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --light-square: #d6e3ec;
            --dark-square: #4f80a3;
            --highlight-square: #a4c57f;
            --board-border: #111111;
            --text-color: #ffffff;
            --text-secondary: #98989f;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
            position: fixed;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        h2 {
            margin: 0 0 4px 0;
            font-size: 18px;
            font-weight: 600;
        }

        #status {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .board-wrapper {
            display: grid;
            grid-template-columns: 24px 1fr 24px;
            grid-template-rows: 24px 1fr 24px;
            background-color: var(--board-border);
            padding: 6px;
            border-radius: 10px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.7);
            flex-shrink: 0;
        }

        .coordinates {
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: var(--text-secondary);
            font-weight: bold;
            font-size: 12px;
            user-select: none;
        }

        .coords-top, .coords-bottom { grid-column: 2; }
        .coords-left, .coords-right { 
            grid-row: 2; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-around;
        }
        
        .coord { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .chessboard {
            grid-column: 2;
            grid-row: 2;
            display: grid;
            grid-template-columns: repeat(8, 38px);
            grid-template-rows: repeat(8, 38px);
            width: 304px;
            height: 304px;
            border: 2px solid var(--board-border);
        }

        .square {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        .square.light { background-color: var(--light-square); }
        .square.dark { background-color: var(--dark-square); }
        
        .square.highlight::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--highlight-square);
            mix-blend-mode: multiply;
            opacity: 0.9;
            pointer-events: none;
        }

        .piece {
            width: 85%;
            height: 85%;
            z-index: 2;
            filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.3));
            pointer-events: none;
        }

        .coords-bottom { grid-row: 3; }
        .coords-top { grid-row: 1; }
        .coords-left { grid-column: 1; }
        .coords-right { grid-column: 3; }

        .controls {
            margin-top: 14px;
            flex-shrink: 0;
        }

        .btn {
            background-color: #3b3b4f;
            color: var(--text-color);
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Шахматы Дуэль</h2>
        <div id="status">Ход: Белые</div>
    </div>

    <div class="board-wrapper">
        <div class="coordinates coords-top"></div>
        <div class="coordinates coords-left"></div>
        <div class="chessboard" id="board"></div>
        <div class="coordinates coords-right"></div>
        <div class="coordinates coords-bottom"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="resetGame()">Новая игра</button>
    </div>

        'bN': `<svg viewBox="0 0 45 45" class="piece"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/><path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/><path d="M16 22c2-1 5-1 7 0m-8 5c3-1 6-1 9 0" stroke="#888" stroke-width="1.2" stroke-linecap="round" fill="none"/><circle cx="9" cy="25.5" r="1" fill="#fff"/><circle cx="16" cy="21.5" r="1" fill="#fff"/></svg>`,

    function renderBoard() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';
        const board = game.board();

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const squareEl = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
                
                const file = 'abcdefgh'[c];
                const rank = 8 - r;
                const squareCoord = file + rank;

                // Подсветка последнего хода или выбранной фигуры
                if (lastMove && (lastMove.from === squareCoord || lastMove.to === squareCoord)) {
                    squareEl.classList.add('highlight');
                }
                if (selectedSquare === squareCoord) {
                    squareEl.classList.add('highlight');
                }

                // Отрисовка фигур на основе движка chess.js
                const piece = board[r][c];
                if (piece) {
                    const pieceKey = piece.color + piece.type.toUpperCase();
                    if (pieces[pieceKey]) {
                        squareEl.innerHTML = pieces[pieceKey];
                    }
                }

                squareEl.onclick = () => onSquareClick(squareCoord);
                boardEl.appendChild(squareEl);
            }
        }
        updateStatus();
    }

    function onSquareClick(square) {
        if (selectedSquare === null) {
            const piece = game.get(square);
            if (piece && piece.color === game.turn()) {
                selectedSquare = square;
                renderBoard();
            }
        } else {
            const move = game.move({
                from: selectedSquare,
                to: square,
                promotion: 'q' // Авто-превращение пешки в ферзя
            });

            if (move !== null) {
                lastMove = move;
                selectedSquare = null;
            } else {
                // Если кликнули на другую свою фигуру — перевыбираем
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                } else {
                    selectedSquare = null;
                }
            }
            renderBoard();
        }
    }

    function updateStatus() {
        let status = '';
        let moveColor = game.turn() === 'w' ? 'Белые' : 'Черные';

        if (game.in_checkmate()) {
            status = `Мат! Победили ${game.turn() === 'w' ? 'Черные' : 'Белые'} 🎉`;
        } else if (game.in_draw()) {
            status = 'Ничья!';
        } else {
            status = `Ход: ${moveColor}`;
            if (game.in_check()) status += ' (Шах!)';
        }
        document.getElementById('status').textContent = status;
    }

    function renderCoordinates() {
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];

        const topCoords = document.querySelector('.coords-top');
        const bottomCoords = document.querySelector('.coords-bottom');
        const leftCoords = document.querySelector('.coords-left');
        const rightCoords = document.querySelector('.coords-right');

        files.forEach(file => {
            topCoords.innerHTML += `<span class="coord">${file}</span>`;
            bottomCoords.innerHTML += `<span class="coord">${file}</span>`;
        });

        ranks.forEach(rank => {
            leftCoords.innerHTML += `<span class="coord">${rank}</span>`;
            rightCoords.innerHTML += `<span class="coord">${rank}</span>`;
        });
    }

    function resetGame() {
        game.reset();
        selectedSquare = null;
        lastMove = null;
        renderBoard();
    }

    renderCoordinates();
    renderBoard();
</script>
</body>
</html>
