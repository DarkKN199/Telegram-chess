<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматы — Telegram Mini App</title>
    <!-- Подключаем шрифты, стили и скрипты -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #2ea44f;
            --text-color: #ffffff;
            --text-secondary: #98989f;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
        }

        h2 {
            margin: 0 0 5px 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        #status {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .board-container {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        #board {
            width: 320px;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        .btn {
            background-color: #2b2b33;
            color: var(--text-color);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-restart {
            background-color: #3b3b4f;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Шахматы Дуэль</h2>
        <div id="status">Ход: Белые</div>
    </div>

    <div class="board-container">
        <div id="board"></div>
    </div>

    <div class="controls">
        <button class="btn btn-restart" onclick="resetGame()">Новая игра</button>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        let board = null;
        let game = new Chess();
        let statusEl = $('#status');

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;

            // Режим на двоих: проверяем, чья очередь ходит
            // Если сейчас ход белых (w), нельзя двигать черные фигуры (начинающиеся с b)
            if (game.turn() === 'w' && piece.search(/^b/) !== -1) return false;
            // Если сейчас ход черных (b), нельзя двигать белые фигуры (начинающиеся с w)
            if (game.turn() === 'b' && piece.search(/^w/) !== -1) return false;
        }

        function onDrop (source, target) {
            // Пытаемся сделать ход
            let move = game.move({
                from: source,
                to: target,
                promotion: 'q' // Авто-превращение пешки в ферзя
            });

            // Если ход незаконный — возвращаем фигуру назад
            if (move === null) return 'snapback';

            updateStatus();
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            let status = '';
            let moveColor = game.turn() === 'w' ? 'Белые' : 'Черные';

            if (game.in_checkmate()) {
                status = `Мат! Победили ${game.turn() === 'w' ? 'Черные' : 'Белые'} 🎉`;
            } else if (game.in_draw()) {
                status = 'Ничья!';
            } else {
                status = `Ход: ${moveColor}`;
                if (game.in_check()) {
                    status += ' (Шах!)';
                }
            }
            statusEl.text(status);
        }

        function resetGame() {
            game.reset();
            board.start();
            updateStatus();
        }

        let config = {
            draggable: true,
            position: 'start',
            // Плавность анимации передвижения фигур
            dropOffBoard: 'snapback',
            sparePieces: false,
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };

        board = Chessboard('board', config);
        updateStatus();

        // Корректировка размера доски при повороте экрана или изменении размеров
        $(window).resize(function() {
            board.resize();
        });
    </script>
</body>
</html>
