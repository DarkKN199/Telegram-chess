<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы Дуэль</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #ffffff;
            --text-secondary: #98989f;
            /* Точная палитра доски как на скриншоте */
            --light-square: #dee3e6;
            --dark-square: #6496c8;
            --highlight-move: #8fb53e;
            --highlight-select: #a7cf49;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
            position: fixed;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        h2 {
            margin: 0 0 4px 0;
            font-size: 20px;
            font-weight: 600;
        }

        #status {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .board-container {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 14px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
            flex-shrink: 0;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 40px);
            grid-template-rows: repeat(8, 40px);
            width: 320px;
            height: 320px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .square {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            flex-shrink: 0;
        }

        .light { background-color: var(--light-square); }
        .dark { background-color: var(--dark-square); }
        
        .selected { background-color: var(--highlight-select) !important; }
        .last-move { background-color: var(--highlight-move) !important; }

        /* Координаты доски */
        .coord-rank {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
            z-index: 2;
        }

        .coord-file {
            position: absolute;
            bottom: 2px;
            left: 4px;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
            z-index: 2;
        }

        .light .coord-rank, .light .coord-file { color: var(--dark-square); }
        .dark .coord-rank, .dark .coord-file { color: var(--light-square); }

        /* Стили для SVG фигур */
        .square svg {
            width: 34px;
            height: 34px;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35));
            pointer-events: none;
        }

        .controls {
            margin-top: 16px;
            flex-shrink: 0;
        }

        .btn {
            background-color: #3b3b4f;
            color: var(--text-color);
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Шахматы Дуэль</h2>
        <div id="status">Ход: Белые</div>
    </div>

    <div class="board-container">
        <div id="board"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="resetGame()">Новая игра</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let game = new Chess();
        let selectedSquare = null;
        let lastMove = null;

        // Векторные SVG контуры фигур высокой детализации
        const svgPaths = {
            p: "M22.5 9c-2.21 0-4 1.79-4 4 0 .89.32 1.7.85 2.34C17.71 16.57 16 19.06 16 22c0 1.95.7 3.74 1.87 5.14C16.55 28.2 15 30.45 15 33h15c0-2.55-1.55-4.8-2.87-5.86C28.3 25.74 29 23.95 29 22c0-2.94-1.71-5.43-4.35-6.66.53-.64.85-1.45.85-2.34 0-2.21-1.79-4-4-4zM13 36h19v3H13z",
            r: "M14 11h3v3h-3zM21 11h3v3h-3zM28 11h3v3h-3zM14 15h17v4H14zM16 19h13v2H16zM17 21h11v11H17zM15 32h15v3H15zM13 35h19v3H13z",
            n: "M22 10c10 1 9 11 5 14 2-2 3-7-2-8 0 7-4 9-7 5 0-4 3-6 3-8-3 1-5 4-6 7-2 0-3 3-2 5 1 2 4 3 6 5-3 0-5-1-7-2 0 4 4 6 10 6 6 0 10-2 10-7 0-5-4-8-10-17z",
            b: "M9 36c0 0 0-4 4-6 2-1 6-2 9.5-2s7.5 1 9.5 2c4 2 4 6 4 6L9 36zM15 32h15l-7.5-22L15 32zM22.5 6c1.5 0 2.5 1 2.5 2.5s-1 2.5-2.5 2.5-2.5-1-2.5-2.5 1-2.5 2.5-2.5z",
            q: "M9 36l27 0-3-20-4 8-5.5-12-5.5 12-4-8-3 20zM12.5 11c1 0 2 1 2 2s-1 2-2 2-2-1-2-2 1-2 2-2zM22.5 8c1 0 2 1 2 2s-1 2-2 2-2-1-2-2 1-2 2-2zM32.5 11c1 0 2 1 2 2s-1 2-2 2-2-1-2-2 1-2 2-2z",
            k: "M22.5 7v4M20.5 9h4M12 36h21l-2-14c0 0-3-2-8.5-2s-8.5 2-8.5 2L12 36zM16 19c0-3 3-5 6.5-5s6.5 2 6.5 5c0 2-3 4-6.5 4s-6.5-2-6.5-4z"
        };

        function createPieceSVG(type, color) {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 45 45");
            
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", svgPaths[type.toLowerCase()]);
            
            if (color === 'w') {
                path.setAttribute("fill", "#ffffff");
                path.setAttribute("stroke", "#1a1a1a");
                path.setAttribute("stroke-width", "1.5");
            } else {
                path.setAttribute("fill", "#1c1c1e");
                path.setAttribute("stroke", "#000000");
                path.setAttribute("stroke-width", "1");
            }
            
            svg.appendChild(path);
            return svg;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            const board = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareEl = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
                    
                    const file = 'abcdefgh'[c];
                    const rank = 8 - r;
                    const squareCoord = file + rank;

                    if (lastMove && (lastMove.from === squareCoord || lastMove.to === squareCoord)) {
                        squareEl.classList.add('last-move');
                    }

                    if (selectedSquare === squareCoord) {
                        squareEl.classList.add('selected');
                    }

                    // Координаты цифр справа
                    if (c === 7) {
                        const rankEl = document.createElement('span');
                        rankEl.className = 'coord-rank';
                        rankEl.textContent = rank;
                        squareEl.appendChild(rankEl);
                    }

                    // Координаты букв снизу
                    if (r === 7) {
                        const fileEl = document.createElement('span');
                        fileEl.className = 'coord-file';
                        fileEl.textContent = file;
                        squareEl.appendChild(fileEl);
                    }

                    // Фигуры
                    const piece = board[r][c];
                    if (piece) {
                        const pieceSvg = createPieceSVG(piece.type, piece.color);
                        squareEl.appendChild(pieceSvg);
                    }

                    squareEl.onclick = () => onSquareClick(squareCoord);
                    boardEl.appendChild(squareEl);
                }
            }
            updateStatus();
        }

        function onSquareClick(square) {
            if (selectedSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    renderBoard();
                }
            } else {
                const move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move !== null) {
                    lastMove = move;
                    selectedSquare = null;
                } else {
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                    } else {
                        selectedSquare = null;
                    }
                }
                renderBoard();
            }
        }

        function updateStatus() {
            let status = '';
            let moveColor = game.turn() === 'w' ? 'Белые' : 'Черные';

            if (game.in_checkmate()) {
                status = `Мат! Победили ${game.turn() === 'w' ? 'Черные' : 'Белые'} 🎉`;
            } else if (game.in_draw()) {
                status = 'Ничья!';
            } else {
                status = `Ход: ${moveColor}`;
                if (game.in_check()) status += ' (Шах!)';
            }
            document.getElementById('status').textContent = status;
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            lastMove = null;
            renderBoard();
        }

        renderBoard();
    </script>
</body>
</html>
