<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы Дуэль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --board-border: #333;
            --text-color: #ffffff;
            --text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
            --highlight-color: rgba(164, 197, 127, 0.75);
            --bg-color: #1e1e1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100vw;
            height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        h2 {
            margin: 0 0 2px 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            text-shadow: var(--text-shadow);
        }

        #status {
            font-size: 13px;
            color: #b0b0b0;
        }

        .board-container {
            position: relative;
            width: 90vmin;
            max-width: 380px;
            aspect-ratio: 1 / 1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 6px;
            flex-shrink: 0;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 4px;
            overflow: hidden;
        }

        .square {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-size: cover;
            background-position: center;
        }

        /* Подсветка ходов и выбора */
        .square.highlight::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--highlight-color);
            pointer-events: none;
        }

        /* Стили для растровых фигур */
        .piece {
            width: 88% !important;
            height: 88% !important;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0px 3px 3px rgba(0, 0, 0, 0.4));
            pointer-events: none;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Координаты доски */
        .coordinates {
            position: absolute;
            display: flex;
            color: var(--text-color);
            font-weight: bold;
            font-size: 12px;
            text-shadow: var(--text-shadow);
            z-index: 10;
            pointer-events: none;
        }

        .files-bottom {
            bottom: 2px;
            left: 0;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            justify-items: center;
        }

        .ranks-right {
            top: 0;
            right: 2px;
            height: 100%;
            display: grid;
            grid-template-rows: repeat(8, 1fr);
            align-items: center;
            justify-items: end;
            padding-right: 2px;
        }

        .controls {
            margin-top: 14px;
            flex-shrink: 0;
        }

        .btn {
            background-color: #3b3b4f;
            color: var(--text-color);
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.96); }
    </style>

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            const board = game.board();

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const isLight = (row + col) % 2 === 0;
                    const squareClass = isLight ? 'light' : 'dark';
                    
                    const file = 'abcdefgh'[col];
                    const rank = 8 - row;
                    const squareCoord = file + rank;

                    const squareEl = document.createElement('div');
                    squareEl.className = `square ${squareClass}`;

                    // Подсветка ходов
                    if (lastMove && (lastMove.from === squareCoord || lastMove.to === squareCoord)) {
                        squareEl.classList.add('highlight');
                    }
                    if (selectedSquare === squareCoord) {
                        squareEl.classList.add('highlight');
                    }

                    const piece = board[row][col];
                    if (piece) {
                        const pieceCode = piece.color + piece.type.toUpperCase();
                        if (pieceImages[pieceCode]) {
                            const pieceEl = document.createElement('div');
                            pieceEl.className = 'piece';
                            pieceEl.style.backgroundImage = `url('${pieceImages[pieceCode]}')`;
                            squareEl.appendChild(pieceEl);
                        }
                    }

                    squareEl.onclick = () => onSquareClick(squareCoord);
                    boardElement.appendChild(squareEl);
                }
            }
            updateStatus();
        }

        function onSquareClick(square) {
            if (selectedSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                                        renderBoard();
                }
            } else {
                const move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move !== null) {
                    lastMove = move;
                    selectedSquare = null;
                } else {
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                    } else {
                        selectedSquare = null;
                    }
                }
                renderBoard();
            }
        }

        function updateStatus() {
            let status = '';
            let moveColor = game.turn() === 'w' ? 'Белые' : 'Черные';

            if (game.in_checkmate()) {
                status = `Мат! Победили ${game.turn() === 'w' ? 'Черные' : 'Белые'} 🎉`;
            } else if (game.in_draw()) {
                status = 'Ничья!';
            } else {
                status = `Ход: ${moveColor}`;
                if (game.in_check()) status += ' (Шах!)';
            }
            document.getElementById('status').textContent = status;
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            lastMove = null;
            renderBoard();
        }

        renderBoard();
    </script>
